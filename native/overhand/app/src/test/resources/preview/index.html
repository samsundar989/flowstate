<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=800">
<title>Counter</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161e; color: #f2f5f8; font-family: sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 32px; }
  #count { font-size: 160px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 32px; }
  button { font-size: 48px; min-width: 240px; min-height: 120px; border: 0; border-radius: 24px; background: #26354a; color: #fff; }
  button:active { background: #3a5272; }
  p { font-size: 28px; color: #c8d2dc; }
</style>
</head>
<body>
<main>
  <div id="count">0</div>
  <div class="row">
    <button id="minus" type="button">Minus</button>
    <button id="plus" type="button">Plus</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <p id="note">Pinch a button to count. Everything runs here, with nothing fetched from anywhere.</p>
</main>
<script>
  // A counter with a short history, so a reload on a new commit is visible: the history starts again from zero.
  var count = 0, history = [];
  function show() {
    document.getElementById('count').textContent = String(count);
    document.getElementById('note').textContent = history.length
      ? 'Last presses: ' + history.slice(-8).join(' ')
      : 'Pinch a button to count. Everything runs here, with nothing fetched from anywhere.';
  }
  function press(delta, label) {
    count = delta === null ? 0 : count + delta;
    history.push(label);
    show();
  }
  document.getElementById('plus').addEventListener('click', function () { press(1, '+'); });
  document.getElementById('minus').addEventListener('click', function () { press(-1, '-'); });
  document.getElementById('reset').addEventListener('click', function () { press(null, '0'); });
  show();
</script>
